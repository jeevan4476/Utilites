[package]
name = "rclip"
version = "0.1.0"
edition = "2024"
authors = ["rclip contributors"]
description = "Lightweight Wayland clipboard history manager"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
glib = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nucleo-matcher = "0.3.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

